name: Live smoke test

on:
  schedule:
    - cron: '30 6 * * 1' # Mondays 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Probe production URLs
    runs-on: ubuntu-latest
    steps:
      - name: Check key routes return 200
        run: |
          set -euo pipefail
          base="https://marvis.web.app"
          routes=(
            "/"
            "/work/"
            "/writing/"
            "/services/"
            "/about/"
            "/contact/"
            "/privacy/"
            "/terms/"
            "/sitemap.xml"
            "/robots.txt"
            "/llms.txt"
          )
          fail=0
          for route in "${routes[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${base}${route}")
            printf '%-24s %s\n' "$route" "$code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit "$fail"

      - name: Check redirects
        run: |
          set -euo pipefail
          for route in /work /writing /services; do
            location=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "https://marvis.web.app${route}")
            printf '%-24s -> %s\n' "$route" "${location:-none}"
          done
