name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [master-record-updated]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-marvis
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy live site
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marvis.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build, validate, test
        run: npm run ci

      - name: Check for deploy credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set; skipping deploy. Add the secret to enable automatic deploys."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.has == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to hosting site "marvis"
        if: steps.creds.outputs.has == 'true'
        run: npx --yes firebase-tools@latest deploy --only hosting:marvis --non-interactive --project my-1st-web-app-ef52d
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
