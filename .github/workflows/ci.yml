name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Lint, typecheck, build, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (lockfile)
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Generate raster assets
        run: bun run og

      - name: Build (static export)
        run: |
          bun run build:export
          if [ ! -f out/404.html ] && [ -f out/404/index.html ]; then
            cp out/404/index.html out/404.html
          fi

      - name: Validate SEO, links and machine surfaces
        run: bun run validate
